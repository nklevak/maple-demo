  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.data)));
  try { sessionStorage.setItem("maple_pw", pw); } catch {}
  document.open(); document.write(html); document.close();
}
document.getElementById("gate").onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try { await unlock(document.getElementById("pw").value); }
  catch { err.textContent = "Incorrect password, try again."; btn.disabled = false; btn.textContent = "Enter"; }
};
// Stay unlocked for the rest of this browser tab session
try { const saved = sessionStorage.getItem("maple_pw"); if (saved) unlock(saved).catch(() => sessionStorage.removeItem("maple_pw")); } catch {}
</script>
