<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maple</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #f7f0ea; color: #3d2b20; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: #fff; border: 1px solid #e8dcd2; border-radius: 14px;
    padding: 28px; box-shadow: 0 6px 20px rgba(59,42,34,.06); text-align: center; }
  .brand { font-family: Georgia, serif; font-size: 1.8rem; font-weight: 700; color: #3d2b20; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .brand svg { width: 32px; height: 32px; }
  p { color: #7b685b; font-size: .92rem; margin: 6px 0 20px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #e8dcd2; border-radius: 10px; font: inherit; }
  input:focus { outline: 2px solid #eedbcf; border-color: #a64b10; }
  button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px; background: #a64b10; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #8a3d0c; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: #B3261E; font-size: .85rem; min-height: 1.2em; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="gate">
  <div class="brand">
    <svg viewBox="0 0 145 155" aria-hidden="true"><ellipse cx="69" cy="73" rx="67.5" ry="71.5" fill="#9ab89f" stroke="#fff" stroke-width="4"/><g stroke="#fff" stroke-width="3"><line x1="69" y1="145" x2="69" y2="46"/><line x1="67.9" y1="73.2" x2="93.2" y2="47.9"/><line x1="43.8" y1="46.9" x2="69.1" y2="72.2"/><line x1="44.5" y1="71.7" x2="44.5" y2="48"/><line x1="92.5" y1="72.7" x2="92.5" y2="49"/><line x1="67.9" y1="97.2" x2="93.2" y2="71.9"/><line x1="44.1" y1="71.2" x2="69.3" y2="96.5"/><line x1="44.5" y1="95.9" x2="44.5" y2="72.2"/><line x1="92.5" y1="96.7" x2="92.5" y2="73"/></g></svg>
    maple
  </div>
  <p>This demo is password protected.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</form>
<script>
const P = __PAYLOAD__;
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.data)));
  try { sessionStorage.setItem("maple_pw", pw); } catch {}
  document.open(); document.write(html); document.close();
}
document.getElementById("gate").onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try { await unlock(document.getElementById("pw").value); }
  catch { err.textContent = "Incorrect password, try again."; btn.disabled = false; btn.textContent = "Enter"; }
};
// Stay unlocked for the rest of this browser tab session
try { const saved = sessionStorage.getItem("maple_pw"); if (saved) unlock(saved).catch(() => sessionStorage.removeItem("maple_pw")); } catch {}
</script>
</body>
</html>
