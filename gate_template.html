<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maple</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #FBF6EF; color: #3B2A22; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: #fff; border: 1px solid #EADFD2; border-radius: 14px;
    padding: 28px; box-shadow: 0 6px 20px rgba(59,42,34,.06); text-align: center; }
  .brand { font-family: Georgia, serif; font-size: 1.8rem; font-weight: 700; color: #C2502E; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .brand svg { width: 32px; height: 32px; }
  p { color: #7A6A60; font-size: .92rem; margin: 6px 0 20px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #EADFD2; border-radius: 10px; font: inherit; }
  input:focus { outline: 2px solid #F7E3D9; border-color: #C2502E; }
  button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px; background: #C2502E; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #9E3D20; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: #B3261E; font-size: .85rem; min-height: 1.2em; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="gate">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#C2502E" d="M16 2l2.6 5.4 3.4-1.6-.9 6 4.9-2.6-1.2 4.2 5.2.9-4 3.6 1.7 2.3-6.4.4.7 4.4-4.9-2.7-.1 7.7h-2l-.1-7.7-4.9 2.7.7-4.4-6.4-.4 1.7-2.3-4-3.6 5.2-.9-1.2-4.2 4.9 2.6-.9-6 3.4 1.6z"/></svg>
    maple
  </div>
  <p>This demo is password protected.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</form>
<script>
const P = __PAYLOAD__;
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.data)));
  try { sessionStorage.setItem("maple_pw", pw); } catch {}
  document.open(); document.write(html); document.close();
}
document.getElementById("gate").onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try { await unlock(document.getElementById("pw").value); }
  catch { err.textContent = "Incorrect password, try again."; btn.disabled = false; btn.textContent = "Enter"; }
};
// Stay unlocked for the rest of this browser tab session
try { const saved = sessionStorage.getItem("maple_pw"); if (saved) unlock(saved).catch(() => sessionStorage.removeItem("maple_pw")); } catch {}
</script>
</body>
</html>
